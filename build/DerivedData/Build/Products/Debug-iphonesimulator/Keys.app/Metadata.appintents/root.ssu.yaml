apiVersion: ssu/v1
nlu:
  shortcuts:
    bundleIdentifier: technology.asteria.keys
    intents:
    - metadata:
        name: OpenKeysIntent_0
        title: Open Keys
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Open ${+applicationName}'
          - '{${+prefix} }Open my ${+applicationName} vault'
    - metadata:
        name: SearchVaultIntent_1
        title: Find in Keys
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Find in ${+applicationName}'
          - '{${+prefix} }Search ${+applicationName}'
    - metadata:
        name: OpenItemIntent_2
        title: Open an Item in Keys
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Open ${VaultItemEntity} in ${+applicationName}'
          - '{${+prefix} }Show ${VaultItemEntity} in ${+applicationName}'
    - metadata:
        name: ComposeLoginIntent_3
        title: Compose a Login
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Compose a login in ${+applicationName}'
          - '{${+prefix} }Make a login in ${+applicationName}'
    - metadata:
        name: CaptureLoginIntent_4
        title: Draft a Login from a Sentence
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Draft a login in ${+applicationName}'
          - '{${+prefix} }Capture a login in ${+applicationName}'
    - metadata:
        name: GeneratePasswordIntent_5
        title: Generate a Password
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Generate a password in ${+applicationName}'
    - metadata:
        name: LockKeysIntent_6
        title: Lock Keys
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }Lock ${+applicationName}'
    - metadata:
        name: +negative
      corpuses:
        training:
        - locale: en
          utterances:
          - '{${+prefix} }${+standardAppShortcutNegatives}'
variables:
- name: +applicationName
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
    - Keys
- name: VaultItemEntity
  type: ssu/parameter
  definitions:
  - locale: en
    synomyms:
    - Vault Item
- name: +prefix
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/prefix/en.yaml
- name: +standardAppShortcutNegatives
  type: ssu/expansion
  definitions:
  - locale: en
    synomyms:
      $ref: ssu://Resources/standardAppShortcutNegatives/en.yaml
